<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 7 Presentation Mode</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="auth-overlay" id="auth"><div class="auth-card"><div class="eyebrow">Facilitator access</div><h1 style="font-size:2.4rem">Presentation mode</h1><form id="authForm"><label for="passcode">Passcode</label><input id="passcode" type="password"><div class="controls"><button class="button yellow">Open presentation</button></div><div class="gate-error" id="authError"></div></form></div></div>
<main class="present-shell"><header class="present-header"><strong>INFS5706 · Week 7</strong><span id="slideTitle"></span><a href="facilitator.html">Facilitator console</a></header><div class="slide-stage"><article class="slide" id="slide" aria-live="polite"></article></div><footer class="present-footer"><button class="button light" id="prev">← Previous</button><span class="slide-number" id="slideNumber"></span><div class="controls" style="margin:0"><button class="button light" id="fullScreen">Full screen</button><button class="button yellow" id="next">Next →</button></div></footer></main>
<aside class="projector-clock-chip" id="projectorClockChip" hidden aria-label="Current phase timer"><span id="chipPhase">Phase 1 · Authority warm-up</span><strong id="chipClock">10:00</strong><small id="chipStatus">Ready or paused</small></aside>
<section class="projector-timer" id="projectorTimer" hidden aria-label="Projected seminar timer"><div class="projected-timer__brand"><img src="https://www.unsw.edu.au/content/dam/images/unsw-wide/general/branding/2022-12-brand/sydney-landscape.cropimg.width=1920.png" alt="UNSW Sydney"><span>INFS5706 · AI in Action</span></div><div class="projected-timer__body"><div class="projected-timer__phase-number" id="projectorPhaseNumber">Phase 1 of 8</div><h1 id="projectorPhase">Authority warm-up</h1><div class="projected-timer__clock" id="projectorClock">10:00</div><div class="projected-timer__status" id="projectorTimerStatus">Ready or paused</div><div class="projected-timer__instruction"><span>Now</span><p id="projectorInstruction">Choose the authority you would give the agent for each action.</p></div></div></section>
<script src="config.js?v=2"></script><script src="facilitator-data.js"></script><script src="presentation.js?v=11"></script></body></html>
